<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>THE KIOSK | PREMIUM CONCIERGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #05070a; 
            color: #ffffff; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* [핵심 개선] 화면의 80%를 차지하면서도 비율을 유지하는 프리미엄 카드 */
        .premium-container {
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent), rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 80px 60px;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .brand-header { text-align: center; }
        .brand-title { 
            font-family: 'Playfair Display', serif; 
            color: #c5a059; 
            font-size: 3rem; 
            letter-spacing: 1.2em;
            margin-right: -1.2em; /* 자간 보정 */
            margin-bottom: 20px;
        }
        
        /* 텍스트 크기 및 가독성 정밀 튜닝 */
        .main-status { 
            font-size: 4.5rem; 
            font-weight: 700; 
            line-height: 1.2; 
            text-align: center;
            color: #f8fafc;
        }

        .reply-area {
            width: 85%;
            min-height: 160px;
            background: rgba(197, 160, 89, 0.08);
            border-radius: 30px;
            display: none; /* 초기 숨김 */
            align-items: center;
            justify-content: center;
            padding: 40px;
            border: 1px dashed rgba(197, 160, 89, 0.3);
            font-size: 2.8rem;
            color: #e2e8f0;
            text-align: center;
        }

        .call-button {
            width: 100%;
            max-width: 700px;
            height: 140px;
            background: #c5a059;
            color: #000;
            font-size: 3.5rem;
            font-weight: 700;
            border-radius: 70px;
            letter-spacing: 0.1em;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(197, 160, 89, 0.2);
        }

        .call-button:active { transform: scale(0.92); background: #d4b475; }

        .loading-dots:after { content: '.'; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
    </style>
</head>
<body>

    <div class="premium-container">
        <div class="brand-header">
            <div class="brand-title">THE KIOSK</div>
            <div style="color: rgba(255,255,255,0.4); font-size: 1.5rem; letter-spacing: 0.5em;">PREMIUM CONCIERGE</div>
        </div>

        <div id="main-status" class="main-status">
            도움이 필요하시면<br>버튼을 눌러주세요
        </div>

        <div id="reply-box" class="reply-area">
            <span id="reply-text">매니저의 응답을 기다리고 있습니다</span>
        </div>

        <button id="call-btn" class="call-button">MANAGER CALL</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://storecall0313-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store_id') || 'S001';

        const btn = document.getElementById('call-btn');
        const status = document.getElementById('main-status');
        const replyBox = document.getElementById('reply-box');
        const replyText = document.getElementById('reply-text');

        btn.onclick = () => {
            const now = Date.now();
            db.ref('stores/' + storeId).update({
                call_signal: now,
                manager_reply: "",
                reply_at: 0
            });
            status.innerHTML = "매니저에게 신호를<br><span class='loading-dots'>보내는 중</span>";
            btn.style.display = 'none';
            replyBox.style.display = 'flex';
        };

        db.ref('stores/' + storeId).on('value', (snap) => {
            const data = snap.val();
            if (data && data.manager_reply) {
                status.innerHTML = "매니저가 곧<br>도착합니다";
                replyText.innerText = data.manager_reply;
                replyBox.style.display = 'flex';
            }
        });
    </script>
</body>
</html>

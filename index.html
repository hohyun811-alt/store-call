<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href='data:application/manifest+json,{"name":"THE KIOSK","short_name":"KIOSK","display":"standalone"}'>

    <title>THE KIOSK | PREMIUM CONCIERGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@100;300;400;700&display=swap');
        
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #0a0f1a; 
            color: #f1f5f9; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* [핵심] 중앙 카드를 화면의 80% 크기로 고정 */
        .premium-card { 
            width: 85vw; /* 가로 85% */
            height: 80vh; /* 세로 80% */
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(197, 160, 89, 0.3); 
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .title-wrapper { text-align: center; }
        .brand-logo { 
            font-family: 'Playfair Display', serif; 
            letter-spacing: 0.8em; 
            color: #c5a059; 
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        /* 상태 메시지 및 답장 영역 확대 */
        .status-text { font-size: 3.5rem; font-weight: 700; line-height: 1.3; margin-top: 2rem; }
        .reply-box { 
            font-size: 2.2rem; 
            color: #c5a059; 
            background: rgba(197, 160, 89, 0.1); 
            padding: 30px 50px; 
            border-radius: 20px;
            margin-top: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 5px solid #c5a059;
            width: 90%;
        }

        .gold-btn { 
            background-color: #c5a059; 
            color: #ffffff; 
            font-size: 2.8rem; 
            font-weight: 700;
            padding: 35px 80px; 
            border-radius: 100px;
            transition: all 0.3s ease; 
            letter-spacing: 0.2em;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.3);
            width: 100%;
            max-width: 600px;
        }
        .gold-btn:active { transform: scale(0.95); background-color: #a68445; }
        
        .loading-dots:after { content: ' .'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: ' .'; } 40% { content: ' ..'; } 60% { content: ' ...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body>

    <div class="premium-card">
        <div class="title-wrapper">
            <div class="brand-logo">THE KIOSK</div>
            <div id="store-name" style="color: rgba(197, 160, 89, 0.6); font-size: 1.2rem; letter-spacing: 0.3em;">PREMIUM CONCIERGE</div>
        </div>

        <div class="text-center">
            <div id="main-status" class="status-text">도움이 필요하시면<br>아래 버튼을 눌러주세요</div>
            <div id="manager-reply-area" class="reply-box" style="display: none;">
                <span id="reply-content">매니저의 답변을 기다리는 중...</span>
            </div>
        </div>

        <button id="call-btn" class="gold-btn">MANAGER CALL</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. 설정 및 초기화
        const firebaseConfig = {
            databaseURL: "https://storecall0313-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. URL에서 매장 ID 추출
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store_id') || 'S001';
        
        const callBtn = document.getElementById('call-btn');
        const mainStatus = document.getElementById('main-status');
        const replyArea = document.getElementById('manager-reply-area');
        const replyContent = document.getElementById('reply-content');

        // 3. 호출 버튼 로직 (기능 유지)
        callBtn.onclick = function() {
            const timestamp = new Date().getTime();
            
            // Firebase 데이터 업데이트 (호출 신호)
            database.ref('stores/' + storeId).update({
                call_signal: timestamp,
                manager_reply: "", // 호출 시 기존 답변 초기화
                reply_at: 0
            });

            // UI 변경
            mainStatus.innerHTML = "매니저에게 신호를<br><span class='loading-dots'>보내고 있습니다</span>";
            callBtn.style.display = "none";
            replyArea.style.display = "flex";
            replyContent.innerText = "매니저가 메시지를 확인 중입니다.";
        };

        // 4. 매니저 답장 실시간 리스너 (기능 유지)
        database.ref('stores/' + storeId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.manager_reply) {
                mainStatus.innerHTML = "매니저가 곧<br>도착합니다";
                replyContent.innerText = data.manager_reply;
                replyArea.style.display = "flex";
            }
        });
    </script>
</body>
</html>
